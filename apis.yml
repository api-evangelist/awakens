apis:
- name: Genomelink Developer API
  description: >-
    OAuth 2.0 REST API for requesting a consenting user's genetic trait reports
    from Genomelink. A report is fetched by trait name and population (for
    example GET /v1/reports/eye-color/?population=european) using a Bearer
    access token obtained via the authorization-code flow. An enterprise
    reports endpoint (POST /v1/enterprise/reports/) exchanges a user token using
    the client secret. Note: the public developer API is currently marked "not
    available" on the developers page.
