aid: awakens
name: AWAKENS
description: >-
  AWAKENS (operating the consumer product Genomelink at genomelink.io) is a
  personal-genomics company that lets people upload the raw DNA data they
  exported from AncestryDNA, 23andMe, or MyHeritage and receive additional
  ancestry, trait, nutrition, and wellness reports interpreted from a knowledge
  base of 100,000+ SNPs across 50+ genetic traits. For developers, AWAKENS
  published the Genomelink Developer API — an OAuth 2.0 (authorization-code)
  REST API that lets third-party apps request a user's genetic trait reports
  (for example eye-color by population) after the user consents, plus an
  enterprise reports endpoint. Official Python (`genomelink`) and Node.js
  (`genomelink-node`) SDKs were shipped on PyPI and npm. The public developer
  API is currently marked "not available" on the developers page, so the
  artifacts here capture the documented OAuth surface, SDKs, and test
  credentials from AWAKENS' own first-party sources.
